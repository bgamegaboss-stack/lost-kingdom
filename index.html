<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lost Kingdom: Ninja Adventure</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #101522;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    color: #65ff91;
    margin: 20px 10px 5px;
    letter-spacing: 3px;
}

.subtitle {
    color: #bbc9d8;
    margin-bottom: 20px;
}

.game {
    width: min(1000px, 96%);
    margin: auto;
}

canvas {
    display: block;
    width: 100%;
    height: auto;
    background: #8bd9ff;
    border: 3px solid #65ff91;
    border-radius: 10px;
    image-rendering: pixelated;
}

.controls {
    color: #d5dfec;
    line-height: 1.8;
    padding: 10px;
}

button {
    padding: 12px 24px;
    background: #65ff91;
    border: 0;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin: 5px;
}

button:hover {
    background: #a0ffb9;
}

#message {
    min-height: 28px;
    color: #ffe779;
    font-weight: bold;
}

</style>
</head>

<body>

<h1>🥷 LOST KINGDOM</h1>
<div class="subtitle">NINJA ADVENTURE</div>

<div class="game">
    <canvas id="game" width="960" height="540"></canvas>

    <div id="message" aria-live="polite">
        Найди сокровище и победи монстров!
    </div>

    <div class="controls">
        <b>A / D</b> — движение |
        <b>Пробел</b> — прыжок |
        <b>J</b> — атака |
        <b>R</b> — начать заново
    </div>

    <button id="restart">🔄 Начать заново</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const message = document.getElementById("message");

const WIDTH = canvas.width;
const HEIGHT = canvas.height;
const WORLD = 3200;
const gravity = 0.65;

const keys = {};

let ninja;
let platforms;
let coins;
let enemies;
let camera;
let score;
let gameState;
let attackTimer;
let frame;

function resetGame() {
    ninja = {
        x: 70,
        y: 350,
        w: 30,
        h: 44,
        vx: 0,
        vy: 0,
        speed: 4.5,
        jump: 13,
        grounded: false,
        facing: 1,
        hp: 3,
        invincible: 0
    };

    platforms = [
        {x: 0,    y: 470, w: 600, h: 70},
        {x: 680,  y: 430, w: 210, h: 30},
        {x: 960,  y: 375, w: 180, h: 30},
        {x: 1200, y: 440, w: 250, h: 30},
        {x: 1510, y: 390, w: 200, h: 30},
        {x: 1760, y: 470, w: 450, h: 70},
        {x: 2280, y: 420, w: 230, h: 30},
        {x: 2580, y: 470, w: 620, h: 70}
    ];

    coins = [
        {x: 180, y: 420, got: false},
        {x: 300, y: 420, got: false},
        {x: 500, y: 420, got: false},
        {x: 740, y: 380, got: false},
        {x: 820, y: 380, got: false},
        {x: 1010, y: 325, got: false},
        {x: 1080, y: 325, got: false},
        {x: 1280, y: 390, got: false},
        {x: 1590, y: 340, got: false},
        {x: 1840, y: 420, got: false},
        {x: 1940, y: 420, got: false},
        {x: 2340, y: 370, got: false},
        {x: 2660, y: 420, got: false},
        {x: 2760, y: 420, got: false}
    ];

    enemies = [
        {x: 400, y: 438, w: 32, h: 32,
         min: 350, max: 540, dir: 1, alive: true},

        {x: 730, y: 398, w: 32, h: 32,
         min: 690, max: 850, dir: 1, alive: true},

        {x: 1300, y: 408, w: 32, h: 32,
         min: 1210, max: 1400, dir: -1, alive: true},

        {x: 1830, y: 438, w: 32, h: 32,
         min: 1780, max: 2140, dir: 1, alive: true},

        {x: 2670, y: 438, w: 32, h: 32,
         min: 2600, max: 3000, dir: -1, alive: true}
    ];

    camera = 0;
    score = 0;
    gameState = "playing";
    attackTimer = 0;
    frame = 0;

    message.textContent =
        "Найди сокровище и победи монстров!";
}

function collision(a, b) {
    return a.x < b.x + b.w &&
           a.x + a.w > b.x &&
           a.y < b.y + b.h &&
           a.y + a.h > b.y;
}

function jump() {
    if (gameState === "playing" && ninja.grounded) {
        ninja.vy = -ninja.jump;
        ninja.grounded = false;
    }
}

function attack() {
    if (gameState !== "playing") return;

    attackTimer = 12;

    const hitbox = {
        x: ninja.facing === 1
            ? ninja.x + ninja.w
            : ninja.x - 38,
        y: ninja.y + 8,
        w: 38,
        h: 30
    };

    for (const enemy of enemies) {
        if (enemy.alive && collision(hitbox, enemy)) {
            enemy.alive = false;
            score += 5;
        }
    }
}

window.addEventListener("keydown", function(e) {
    const key = e.key.toLowerCase();

    if ([
        " ", "arrowup", "arrowleft", "arrowright", "arrowdown"
    ].includes(key)) {
        e.preventDefault();
    }

    keys[key] = true;

    if (!e.repeat &&
        (key === " " || key === "w" || key === "arrowup")) {
        jump();
    }

    if (!e.repeat && key === "j") {
        attack();
    }

    if (!e.repeat && key === "r") {
        resetGame();
    }
});

window.addEventListener("keyup", function(e) {
    keys[e.key.toLowerCase()] = false;
});

document.getElementById("restart").addEventListener(
    "click", resetGame
);

function update() {
    if (gameState !== "playing") return;

    frame++;

    ninja.vx = 0;

    if (keys["a"] || keys["arrowleft"]) {
        ninja.vx = -ninja.speed;
        ninja.facing = -1;
    }

    if (keys["d"] || keys["arrowright"]) {
        ninja.vx = ninja.speed;
        ninja.facing = 1;
    }

    // Движение по горизонтали
    ninja.x += ninja.vx;
    ninja.x = Math.max(0, Math.min(WORLD - ninja.w, ninja.x));

    for (const p of platforms) {
        if (!collision(ninja, p)) continue;

        if (ninja.vx > 0) {
            ninja.x = p.x - ninja.w;
        } else if (ninja.vx < 0) {
            ninja.x = p.x + p.w;
        }
    }

    // Гравитация и прыжки
    const oldBottom = ninja.y + ninja.h;

    ninja.vy += gravity;
    ninja.y += ninja.vy;
    ninja.grounded = false;

    for (const p of platforms) {
        if (!collision(ninja, p)) continue;

        if (ninja.vy >= 0 && oldBottom <= p.y + 8) {
            ninja.y = p.y - ninja.h;
            ninja.vy = 0;
            ninja.grounded = true;
        } else if (ninja.vy < 0) {
            ninja.y = p.y + p.h;
            ninja.vy = 0;
        }
    }

    if (ninja.invincible > 0) ninja.invincible--;
    if (attackTimer > 0) attackTimer--;

    // Сбор монет
    for (const coin of coins) {
        if (coin.got) continue;

        const box = {
            x: coin.x - 10,
            y: coin.y - 10,
            w: 20,
            h: 20
        };

        if (collision(ninja, box)) {
            coin.got = true;
            score++;
        }
    }

    // Монстры
    for (const enemy of enemies) {
        if (!enemy.alive) continue;

        enemy.x += enemy.dir * 1.1;

        if (enemy.x < enemy.min || enemy.x > enemy.max) {
            enemy.dir *= -1;
        }

        if (!collision(ninja, enemy)) continue;
        if (ninja.invincible > 0) continue;

        const stomp =
            ninja.vy > 0 &&
            ninja.y + ninja.h - enemy.y < 18;

        if (stomp) {
            enemy.alive = false;
            ninja.vy = -9;
            score += 5;
        } else {
            ninja.hp--;
            ninja.invincible = 90;
            ninja.vy = -6;
            ninja.vx = -ninja.facing * 3;

            if (ninja.hp <= 0) {
                gameState = "lost";
            }
        }
    }

    // Падение в пропасть
    if (ninja.y > HEIGHT + 100) {
        gameState = "lost";
    }

    // Сундук с сокровищем
    const chest = {
        x: 3010,
        y: 426,
        w: 42,
        h: 44
    };

    if (collision(ninja, chest)) {
        gameState = "won";
    }

    // Камера следует за ниндзя
    camera = Math.max(
        0,
        Math.min(ninja.x - 250, WORLD - WIDTH)
    );

    if (gameState === "won") {
        message.textContent =
            "🏆 ПОБЕДА! Ты нашёл сокровище! Очки: " + score;
    } else if (gameState === "lost") {
        message.textContent =
            "💀 Поражение! Нажми R, чтобы попробовать снова.";
    } else {
        message.textContent =
            "❤️ " + ninja.hp +
            "     🪙 " + score +
            "     ⚔️ Уничтожай монстров!";
    }
}

function drawBackground() {
    const sky = ctx.createLinearGradient(0, 0, 0, HEIGHT);
    sky.addColorStop(0, "#65c8f5");
    sky.addColorStop(1, "#d8f6d1");

    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, WIDTH, HEIGHT);

    // Солнце
    ctx.fillStyle = "#fff1a3";
    ctx.beginPath();
    ctx.arc(820, 75, 36, 0, Math.PI * 2);
    ctx.fill();

    // Горы
    ctx.fillStyle = "#9ac9a4";

    for (let i = 0; i < 12; i++) {
        const x = i * 180 - (camera * 0.2 % 180);

        ctx.beginPath();
        ctx.moveTo(x, 420);
        ctx.lineTo(x + 100, 180 + (i % 3) * 25);
        ctx.lineTo(x + 220, 420);
        ctx.fill();
    }

    // Лес
    for (let i = 0; i < 25; i++) {
        const x = i * 145 - (camera * 0.45 % 145);

        ctx.fillStyle = "#70472c";
        ctx.fillRect(x + 20, 300, 20, 120);

        ctx.fillStyle = "#277849";
        ctx.beginPath();
        ctx.arc(x + 30, 285, 48, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#398d4d";
        ctx.beginPath();
        ctx.arc(x + 5, 305, 30, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawPlatforms() {
    for (const p of platforms) {
        const x = p.x - camera;

        if (x + p.w < 0 || x > WIDTH) continue;

        ctx.fillStyle = "#77502e";
        ctx.fillRect(x, p.y, p.w, p.h);

        ctx.fillStyle = "#40a64b";
        ctx.fillRect(x, p.y, p.w, 9);

        ctx.fillStyle = "#987046";

        for (let i = 12; i < p.w; i += 35) {
            ctx.fillRect(x + i, p.y + 20, 15, 5);
        }
    }
}

function drawNinja() {
    const x = ninja.x - camera;
    const y = ninja.y;

    if (ninja.invincible > 0 &&
        Math.floor(frame / 5) % 2 === 0) {
        return;
    }

    ctx.save();

    if (ninja.facing === -1) {
        ctx.translate(x + ninja.w, 0);
        ctx.scale(-1, 1);
    } else {
        ctx.translate(x, 0);
    }

    // Ноги
    ctx.fillStyle = "#202431";
    ctx.fillRect(4, y + 32, 9, 12);
    ctx.fillRect(18, y + 32, 9, 12);

    // Тело
    ctx.fillStyle = "#252b3d";
    ctx.fillRect(3, y + 15, 25, 21);

    // Руки
    ctx.fillStyle = "#30384d";
    ctx.fillRect(0, y + 18, 7, 15);
    ctx.fillRect(24, y + 18, 7, 15);

    // Голова
    ctx.fillStyle = "#171b29";
    ctx.fillRect(2, y, 27, 20);

    // Глаза
    ctx.fillStyle = "#f3f1dd";
    ctx.fillRect(17, y + 7, 8, 4);

    // Красная повязка
    ctx.fillStyle = "#e34450";
    ctx.fillRect(0, y + 13, 29, 5);

    // Пояс
    ctx.fillRect(3, y + 29, 25, 4);

    // Меч
    if (attackTimer > 0) {
        ctx.fillStyle = "#e8edf2";
        ctx.fillRect(27, y + 19, 28, 5);

        ctx.fillStyle = "#9aa7b4";
        ctx.fillRect(26, y + 17, 5, 9);
    }

    ctx.restore();
}

function drawCoins() {
    for (const coin of coins) {
        if (coin.got) continue;

        const x = coin.x - camera;

        if (x < -20 || x > WIDTH + 20) continue;

        ctx.fillStyle = "#ffcb35";
        ctx.beginPath();
        ctx.arc(x, coin.y, 10, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = "#fff1a0";
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.fillStyle = "#b77a13";
        ctx.fillRect(x - 2, coin.y - 5, 4, 10);
    }
}

function drawEnemies() {
    for (const enemy of enemies) {
        if (!enemy.alive) continue;

        const x = enemy.x - camera;
        if (x < -50 || x > WIDTH + 50) continue;

        // Монстр-слизень
        ctx.fillStyle = "#8b45bc";

        ctx.beginPath();
        ctx.ellipse(
            x + 16, enemy.y + 20,
            16, 13, 0, Math.PI, 0
        );
        ctx.lineTo(x + 32, enemy.y + 29);
        ctx.quadraticCurveTo(
            x + 16, enemy.y + 39,
            x, enemy.y + 29
        );
        ctx.closePath();
        ctx.fill();

        // Глаза
        ctx.fillStyle = "white";
        ctx.fillRect(x + 7, enemy.y + 16, 6, 7);
        ctx.fillRect(x + 20, enemy.y + 16, 6, 7);

        ctx.fillStyle = "#252030";
        ctx.fillRect(x + 10, enemy.y + 19, 3, 4);
        ctx.fillRect(x + 22, enemy.y + 19, 3, 4);
    }
}

function drawChest() {
    const x = 3010 - camera;
    const y = 426;

    ctx.fillStyle = "#75411e";
    ctx.fillRect(x, y + 12, 42, 30);

    ctx.fillStyle = "#e5a52b";
    ctx.fillRect(x, y + 8, 42, 11);

    ctx.fillStyle = "#ffe078";
    ctx.fillRect(x + 17, y + 17, 8, 10);

    ctx.fillStyle = "#f5d46c";
    ctx.fillRect(x + 3, y + 4, 36, 5);
}

function drawOverlay() {
    if (gameState === "playing") return;

    ctx.fillStyle = "rgba(10, 15, 25, 0.78)";
    ctx.fillRect(0, 0, WIDTH, HEIGHT);

    ctx.textAlign = "center";
    ctx.fillStyle = gameState === "won"
        ? "#ffe078"
        : "#ff7373";

    ctx.font = "bold 42px Arial";

    ctx.fillText(
        gameState === "won" ? "ПОБЕДА!" : "ИГРА ОКОНЧЕНА",
        WIDTH / 2,
        HEIGHT / 2 - 20
    );

    ctx.fillStyle = "white";
    ctx.font = "22px Arial";

    ctx.fillText(
        "Очки: " + score + " | Нажми R для рестарта",
        WIDTH / 2,
        HEIGHT / 2 + 30
    );
}

function draw() {
    drawBackground();
    drawPlatforms();
    drawCoins();
    drawEnemies();
    drawChest();
    drawNinja();
    drawOverlay();
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

resetGame();
loop();
</script>

</body>
</html>
