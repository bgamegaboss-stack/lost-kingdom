<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lost Kingdom — Ninja Adventure</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    background:#10151e;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
}
h1{
    margin:14px 0 4px;
    color:#f4c96b;
    letter-spacing:4px;
    text-shadow:0 3px 12px #b64b36;
}
.subtitle{
    color:#a9b8ca;
    margin-bottom:12px;
}
.game{
    width:min(1200px,98%);
    margin:auto;
}
canvas{
    display:block;
    width:100%;
    height:auto;
    border:2px solid #b58b4c;
    border-radius:8px;
    background:#16283b;
    box-shadow:0 0 35px #0009;
}
.hud{
    display:flex;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
    padding:10px 4px;
    color:#ffe6a3;
    font-weight:bold;
}
.controls{
    color:#d5dce6;
    padding:8px;
    line-height:2;
}
button{
    background:#263448;
    border:1px solid #d2a85d;
    color:#ffe4a1;
    padding:10px 18px;
    border-radius:7px;
    font-weight:bold;
    cursor:pointer;
    margin:4px;
}
button:hover{background:#40516a}
.mobile{
    display:none;
    gap:8px;
    justify-content:center;
    flex-wrap:wrap;
    padding:8px;
}
.mobile button{
    min-width:64px;
    min-height:55px;
    font-size:20px;
    touch-action:none;
}
#message{
    color:#ffe5a0;
    min-height:24px;
    padding:5px;
}
@media(max-width:700px){
    .mobile{display:flex}
    .controls{font-size:13px}
}
</style>
</head>

<body>
<h1>LOST KINGDOM</h1>
<div class="subtitle">忍者 — NINJA ADVENTURE</div>

<div class="game">
<canvas id="game" width="960" height="540"></canvas>

<div class="hud">
    <span id="health">❤️❤️❤️</span>
    <span id="coins">🪙 Монеты: 0</span>
    <span id="kills">⚔️ Победы: 0</span>
</div>

<div id="message">Найди золотой сундук! Победи врагов на пути.</div>

<div class="controls">
    <b>A / D</b> — движение
    · <b>Пробел / W</b> — прыжок
    · <b>J / K</b> — атака
    · <b>R</b> — рестарт
</div>

<div class="mobile">
    <button data-key="a">◀</button>
    <button data-key="d">▶</button>
    <button data-action="jump">ПРЫЖОК</button>
    <button data-action="attack">⚔️ УДАР</button>
</div>

<button id="restart">↻ Начать заново</button>
<button id="pause">Ⅱ Пауза</button>
</div>

<script>
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = canvas.width;
const H = canvas.height;

const WORLD = 3500;
const GRAVITY = 0.62;
const keys = Object.create(null);

let player, platforms, coins, enemies, particles;
let camera = 0;
let score = 0;
let kills = 0;
let state = "playing";
let paused = false;
let frame = 0;
let attackTime = 0;
let attackCooldown = 0;
let lastTime = 0;

function resetGame(){
    player = {
        x:60,y:300,w:30,h:46,
        vx:0,vy:0,speed:4.2,
        facing:1,grounded:false,
        hp:3,invincible:0
    };

    platforms = [
        {x:0,y:455,w:540,h:100},
        {x:590,y:405,w:190,h:25},
        {x:825,y:350,w:190,h:25},
        {x:1060,y:415,w:280,h:25},
        {x:1390,y:365,w:190,h:25},
        {x:1640,y:445,w:420,h:100},
        {x:2110,y:390,w:190,h:25},
        {x:2360,y:330,w:190,h:25},
        {x:2610,y:420,w:890,h:120}
    ];

    coins = [];
    [
        [150,410],[240,410],[340,410],[440,410],
        [630,360],[700,360],[860,305],[950,305],
        [1120,370],[1220,370],[1450,320],[1530,320],
        [1740,400],[1850,400],[1970,400],
        [2160,345],[2250,345],[2410,285],[2500,285],
        [2700,375],[2810,375],[2920,375],[3150,375]
    ].forEach(([x,y])=>coins.push({x,y,got:false,phase:Math.random()*6}));

    enemies = [
        makeEnemy(340,423,260,490),
        makeEnemy(635,373,600,735),
        makeEnemy(1120,383,1080,1280),
        makeEnemy(1750,413,1680,2010),
        makeEnemy(2160,358,2120,2260),
        makeEnemy(2780,383,2640,3020),
        makeEnemy(3200,383,3100,3370)
    ];

    particles=[];
    camera=0;
    score=0;
    kills=0;
    state="playing";
    paused=false;
    attackTime=0;
    attackCooldown=0;
    frame=0;
    updateHUD();
    document.getElementById("message").textContent =
        "Найди золотой сундук! Победи врагов на пути.";
    document.getElementById("pause").textContent="Ⅱ Пауза";
}

function makeEnemy(x,y,min,max){
    return {
        x,y,w:34,h:32,min,max,
        dir:1,hp:2,alive:true,
        speed:0.8+Math.random()*0.35,
        phase:Math.random()*6
    };
}

function rects(a,b){
    return a.x < b.x+b.w &&
           a.x+a.w > b.x &&
           a.y < b.y+b.h &&
           a.y+a.h > b.y;
}

function jump(){
    if(state==="playing"&&!paused&&player.grounded){
        player.vy=-12.7;
        player.grounded=false;
        puff(player.x+player.w/2,player.y+player.h,"#d7d5b6",7);
    }
}

function attack(){
    if(state!=="playing"||paused||attackCooldown>0)return;

    attackTime=13;
    attackCooldown=22;

    const hit={
        x:player.facing===1?player.x+player.w:player.x-52,
        y:player.y+5,w:52,h:38
    };

    for(const e of enemies){
        if(!e.alive||!rects(hit,e))continue;

        e.hp--;
        e.x+=player.facing*12;
        puff(e.x+e.w/2,e.y+15,"#e9b6ff",12);

        if(e.hp<=0){
            e.alive=false;
            score+=5;
            kills++;
            puff(e.x+e.w/2,e.y+15,"#a85bea",18);
        }
    }

    // Вспышка от удара
    puff(
        player.x+(player.facing===1?player.w+20:-20),
        player.y+24,
        "#fff0b0",5
    );
}

function puff(x,y,color,count){
    for(let i=0;i<count;i++){
        particles.push({
            x,y,
            vx:(Math.random()-.5)*5,
            vy:(Math.random()-.7)*4,
            life:20+Math.random()*20,
            max:40,
            size:2+Math.random()*4,
            color
        });
    }
}

window.addEventListener("keydown",e=>{
    const k=e.key.toLowerCase();

    if([" ","arrowleft","arrowright","arrowup","arrowdown"].includes(k)){
        e.preventDefault();
    }

    keys[k]=true;

    if(e.repeat)return;

    if(k===" "||k==="w"||k==="arrowup")jump();
    if(k==="j"||k==="k"||k==="к")attack();
    if(k==="r")resetGame();

    if(k==="escape"||k==="p")togglePause();
});

window.addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()]=false;
});

window.addEventListener("blur",()=>{
    for(const k in keys)keys[k]=false;
});

function togglePause(){
    if(state!=="playing")return;
    paused=!paused;
    document.getElementById("pause").textContent=
        paused?"▶ Продолжить":"Ⅱ Пауза";
}

document.getElementById("restart").addEventListener("click",resetGame);
document.getElementById("pause").addEventListener("click",togglePause);

document.querySelectorAll("[data-key]").forEach(button=>{
    const k=button.dataset.key;

    const down=e=>{
        e.preventDefault();
        keys[k]=true;
    };
    const up=e=>{
        e.preventDefault();
        keys[k]=false;
    };

    button.addEventListener("pointerdown",down);
    button.addEventListener("pointerup",up);
    button.addEventListener("pointercancel",up);
    button.addEventListener("pointerleave",up);
});

document.querySelector('[data-action="jump"]').addEventListener("pointerdown",e=>{
    e.preventDefault();jump();
});
document.querySelector('[data-action="attack"]').addEventListener("pointerdown",e=>{
    e.preventDefault();attack();
});

function updateHUD(){
    document.getElementById("health").textContent=
        "❤️".repeat(Math.max(0,player.hp))+
        "🖤".repeat(3-Math.max(0,player.hp));
    document.getElementById("coins").textContent="🪙 Монеты: "+score;
    document.getElementById("kills").textContent="⚔️ Победы: "+kills;
}

function update(dt){
    if(state!=="playing"||paused)return;

    frame++;
    const step=Math.min(dt/16.67,2);

    player.vx=0;
    if(keys.a||keys.arrowleft){
        player.vx=-player.speed;
        player.facing=-1;
    }
    if(keys.d||keys.arrowright){
        player.vx=player.speed;
        player.facing=1;
    }

    // Горизонтальное движение и столкновения
    player.x+=player.vx*step;
    player.x=Math.max(0,Math.min(WORLD-player.w,player.x));

    for(const p of platforms){
        if(!rects(player,p))continue;

        if(player.vx>0)player.x=p.x-player.w;
        if(player.vx<0)player.x=p.x+p.w;
    }

    // Вертикальная физика
    const oldBottom=player.y+player.h;
    player.vy+=GRAVITY*step;
    player.y+=player.vy*step;
    player.grounded=false;

    for(const p of platforms){
        if(!rects(player,p))continue;

        if(player.vy>=0&&oldBottom<=p.y+12){
            player.y=p.y-player.h;
            player.vy=0;
            player.grounded=true;
        }else if(player.vy<0){
            player.y=p.y+p.h;
            player.vy=0;
        }
    }

    if(player.invincible>0)player.invincible-=step;
    if(attackTime>0)attackTime-=step;
    if(attackCooldown>0)attackCooldown-=step;

    // Монеты
    for(const c of coins){
        if(c.got)continue;
        const box={x:c.x-11,y:c.y-11,w:22,h:22};

        if(rects(player,box)){
            c.got=true;
            score++;
            puff(c.x,c.y,"#ffd65b",10);
        }
    }

    // Враги
    for(const e of enemies){
        if(!e.alive)continue;

        e.x+=e.dir*e.speed*step;
        if(e.x<e.min){e.x=e.min;e.dir=1;}
        if(e.x>e.max){e.x=e.max;e.dir=-1;}

        if(!rects(player,e)||player.invincible>0)continue;

        const stomping=player.vy>1&&oldBottom<=e.y+12;

        if(stomping){
            e.hp=0;
            e.alive=false;
            player.vy=-9;
            score+=5;
            kills++;
            puff(e.x+15,e.y+15,"#bb83f7",15);
        }else{
            player.hp--;
            player.invincible=85;
            player.vy=-6;
            player.x-=player.facing*18;
            puff(player.x+15,player.y+20,"#ff655c",12);

            if(player.hp<=0)state="lost";
        }
    }

    // Частицы
    for(const p of particles){
        p.x+=p.vx*step;
        p.y+=p.vy*step;
        p.vy+=.12*step;
        p.life-=step;
    }
    particles=particles.filter(p=>p.life>0);

    // Падение
    if(player.y>H+150)state="lost";

    // Сундук
    const chest={x:3380,y:365,w:48,h:50};
    if(rects(player,chest)){
        state="won";
        puff(chest.x+24,chest.y,"#ffdf78",50);
    }

    camera=Math.max(0,Math.min(player.x-300,WORLD-W));
    updateHUD();

    if(state==="won"){
        document.getElementById("message").textContent=
            "🏆 ПОБЕДА! Ты нашёл сокровище! Нажми R, чтобы сыграть снова.";
    }else if(state==="lost"){
        document.getElementById("message").textContent=
            "💀 Поражение! Нажми R, чтобы попробовать ещё раз.";
    }
}

// Фон: небо, горы, солнце и туман
function drawBackground(){
    const sky=ctx.createLinearGradient(0,0,0,H);
    sky.addColorStop(0,"#243d67");
    sky.addColorStop(.48,"#e89a85");
    sky.addColorStop(1,"#f9d8a0");
    ctx.fillStyle=sky;
    ctx.fillRect(0,0,W,H);

    // Солнце
    const glow=ctx.createRadialGradient(690,125,10,690,125,125);
    glow.addColorStop(0,"#fff8ccaa");
    glow.addColorStop(1,"#ffe9a000");
    ctx.fillStyle=glow;
    ctx.fillRect(540,0,300,280);

    ctx.fillStyle="#ffe8a8";
    ctx.beginPath();ctx.arc(690,125,47,0,Math.PI*2);ctx.fill();

    // Далёкие горы
    for(let i=0;i<9;i++){
        const x=i*150-(camera*.13%150);

        ctx.fillStyle=i%2?"#596b88":"#435a7a";
        ctx.beginPath();
        ctx.moveTo(x-60,360);
        ctx.lineTo(x+65,105+(i%3)*32);
        ctx.lineTo(x+190,360);
        ctx.closePath();ctx.fill();

        ctx.fillStyle="#d4dbe3";
        ctx.beginPath();
        ctx.moveTo(x+42,153+(i%3)*32);
        ctx.lineTo(x+65,105+(i%3)*32);
        ctx.lineTo(x+91,160+(i%3)*32);
        ctx.lineTo(x+68,151+(i%3)*32);
        ctx.lineTo(x+58,163+(i%3)*32);
        ctx.closePath();ctx.fill();
    }

    // Дальний замок
    drawCastle(730-camera*.22,205);

    // Туман
    for(let i=0;i<8;i++){
        const x=(i*155-camera*.28+frame*.15)%(W+200)-100;
        ctx.fillStyle="#e9e8e9";
        ctx.globalAlpha=.12;
        ctx.beginPath();
        ctx.ellipse(x,330+i%3*30,100,15,0,0,Math.PI*2);
        ctx.fill();
    }
    ctx.globalAlpha=1;
}

function drawCastle(x,y){
    ctx.fillStyle="#38465b";
    ctx.fillRect(x-35,y+70,115,55);
    ctx.fillRect(x-20,y+35,85,40);
    ctx.fillRect(x-7,y+7,55,35);

    drawRoof(x-48,y+70,140);
    drawRoof(x-29,y+35,105);
    drawRoof(x-15,y+7,72);

    for(let i=0;i<3;i++){
        ctx.fillStyle="#ffdca0";
        ctx.fillRect(x-12+i*32,y+85,9,14);
        ctx.fillRect(x-7+i*25,y+47,7,11);
    }
}

function drawRoof(x,y,w){
    ctx.fillStyle="#28374c";
    ctx.beginPath();
    ctx.moveTo(x,y);
    ctx.lineTo(x+w/2,y-18);
    ctx.lineTo(x+w,y);
    ctx.lineTo(x+w-8,y+5);
    ctx.lineTo(x+8,y+5);
    ctx.closePath();ctx.fill();

    ctx.strokeStyle="#c49c63";
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(x+5,y+3);
    ctx.lineTo(x+w-5,y+3);
    ctx.stroke();
}

// Деревья сакуры
function drawTree(x,y,scale=1){
    ctx.save();
    ctx.translate(x,y);
    ctx.scale(scale,scale);

    ctx.fillStyle="#382c35";
    ctx.fillRect(-8,-100,16,100);

    ctx.strokeStyle="#382c35";
    ctx.lineWidth=10;
    ctx.beginPath();
    ctx.moveTo(0,-55);ctx.lineTo(-32,-85);
    ctx.moveTo(0,-65);ctx.lineTo(30,-105);
    ctx.stroke();

    for(let i=0;i<18;i++){
        const a=i*2.399;
        const r=20+((i*17)%45);
        ctx.fillStyle=["#e98eaf","#f3aac4","#d979a1","#f6bfd0"][i%4];
        ctx.beginPath();
        ctx.arc(Math.cos(a)*r, -83+Math.sin(a)*r*.65, 10+(i%4),0,Math.PI*2);
        ctx.fill();
    }
    ctx.restore();
}

// Фоновые деревья двигаются медленнее мира
function drawForest(){
    for(let i=0;i<14;i++){
        const x=i*190-(camera*.45%190);
        if(i%3===0)drawTree(x,405,.8);
        else{
            ctx.fillStyle="#263e42";
            ctx.fillRect(x,290,13,130);
            ctx.fillStyle=i%2?"#2b6150":"#34715a";
            for(let j=0;j<4;j++){
                ctx.beginPath();
                ctx.moveTo(x-45+j*3,330-j*24);
                ctx.lineTo(x+6,245-j*24);
                ctx.lineTo(x+53-j*3,330-j*24);
                ctx.closePath();ctx.fill();
            }
        }
    }
}

// Платформы с травой, землёй и камнями
function drawPlatforms(){
    for(const p of platforms){
        const x=p.x-camera;
        if(x+p.w<0||x>W)continue;

        ctx.fillStyle="#302e36";
        ctx.fillRect(x,p.y,p.w,p.h);

        ctx.fillStyle="#514348";
        ctx.fillRect(x,p.y+12,p.w,p.h-12);

        for(let i=8;i<p.w;i+=24){
            const yy=p.y+20+(i%3)*15;
            ctx.fillStyle=(i%2)?"#74605a":"#413c45";
            ctx.fillRect(x+i,yy,12,8);
        }

        // Трава
        ctx.fillStyle="#3e793f";
        ctx.fillRect(x,p.y,p.w,10);
        ctx.fillStyle="#83a84f";
        ctx.fillRect(x,p.y,p.w,3);

        for(let i=5;i<p.w;i+=13){
            ctx.fillStyle=i%2?"#91bc59":"#527e3d";
            ctx.fillRect(x+i,p.y-2-(i%3),3,5+(i%3));
        }

        // Корни и свисающие травинки
        for(let i=20;i<p.w;i+=37){
            ctx.strokeStyle="#4b5a35";
            ctx.lineWidth=2;
            ctx.beginPath();
            ctx.moveTo(x+i,p.y+5);
            ctx.lineTo(x+i+((i%3)-1)*5,p.y+17);
            ctx.stroke();
        }
    }
}

// Каменная дорожная лампа
function drawLantern(x,y){
    ctx.fillStyle="#40383b";
    ctx.fillRect(x-20,y+30,40,10);
    ctx.fillRect(x-13,y-2,26,34);
    ctx.fillStyle="#f8ce77";
    ctx.fillRect(x-8,y+4,16,23);
    ctx.fillStyle="#d9a45b";
    ctx.fillRect(x-25,y-8,50,7);
    ctx.fillRect(x-18,y-15,36,7);

    ctx.fillStyle="#ffe6a0";
    ctx.globalAlpha=.17;
    ctx.beginPath();ctx.arc(x,y+15,37,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
}

// Сундук с золотой окантовкой
function drawChest(){
    const x=3380-camera,y=390;

    ctx.fillStyle="#493025";
    ctx.fillRect(x,y+13,48,35);

    ctx.fillStyle="#98602e";
    ctx.fillRect(x,y+3,48,17);

    ctx.fillStyle="#e9b956";
    ctx.fillRect(x,y+17,48,5);
    ctx.fillRect(x+5,y+7,4,38);
    ctx.fillRect(x+39,y+7,4,38);

    ctx.fillStyle="#ffdf7b";
    ctx.fillRect(x+20,y+20,9,12);
    ctx.fillRect(x+22,y+22,5,7);

    if(frame%40<20){
        ctx.fillStyle="#fff2a0";
        ctx.globalAlpha=.6;
        ctx.beginPath();ctx.arc(x+24,y-4,18,0,Math.PI*2);ctx.fill();
        ctx.globalAlpha=1;
    }
}

// Монеты
function drawCoins(){
    for(const c of coins){
        if(c.got)continue;

        const x=c.x-camera;
        if(x<-20||x>W+20)continue;

        const y=c.y+Math.sin(frame*.07+c.phase)*4;

        ctx.fillStyle="#8f5a19";
        ctx.beginPath();ctx.ellipse(x,y,10,12,0,0,Math.PI*2);ctx.fill();

        ctx.fillStyle="#ffbd32";
        ctx.beginPath();ctx.ellipse(x,y,8,10,0,0,Math.PI*2);ctx.fill();

        ctx.strokeStyle="#fff0a0";
        ctx.lineWidth=2;
        ctx.beginPath();ctx.ellipse(x,y,4,7,0,0,Math.PI*2);ctx.stroke();

        ctx.fillStyle="#fff2b1";
        ctx.fillRect(x-2,y-5,2,7);
    }
}

// Враги-ниндзя
function drawEnemies(){
    for(const e of enemies){
        if(!e.alive)continue;
        const x=e.x-camera,y=e.y;
        if(x<-60||x>W+60)continue;

        const bob=Math.sin(frame*.12+e.phase)*2;

        // Тень
        ctx.fillStyle="#18212c66";
        ctx.beginPath();
        ctx.ellipse(x+17,y+32,19,5,0,0,Math.PI*2);ctx.fill();

        // Ноги
        ctx.fillStyle="#282438";
        ctx.fillRect(x+5,y+21+bob,9,11);
        ctx.fillRect(x+21,y+21+bob,8,11);

        // Тело
        ctx.fillStyle="#47304f";
        ctx.fillRect(x+4,y+8+bob,27,20);

        // Руки
        ctx.fillStyle="#35253e";
        ctx.fillRect(x,y+11+bob,8,15);
        ctx.fillRect(x+27,y+11+bob,8,15);

        // Голова и маска
        ctx.fillStyle="#382742";
        ctx.fillRect(x+5,y+bob,25,15);

        ctx.fillStyle="#f1b5ff";
        ctx.fillRect(x+19,y+5+bob,5,3);
        ctx.fillRect(x+10,y+5+bob,5,3);

        // Соломенная шляпа
        ctx.fillStyle="#a9814d";
        ctx.fillRect(x-3,y-3+bob,40,5);
        ctx.fillRect(x+5,y-10+bob,24,8);
        ctx.fillStyle="#d3aa67";
        ctx.fillRect(x+7,y-9+bob,20,2);

        // Полоска здоровья
        ctx.fillStyle="#4a202b";
        ctx.fillRect(x,y-19,35,5);
        ctx.fillStyle="#e65058";
        ctx.fillRect(x,y-19,35*(e.hp/2),5);
    }
}

// Главный герой
function drawPlayer(){
    const x=player.x-camera,y=player.y;

    if(player.invincible>0&&Math.floor(frame/4)%2===0)return;

    ctx.save();

    if(player.facing===-1){
        ctx.translate(x+player.w,0);
        ctx.scale(-1,1);
    }else{
        ctx.translate(x,0);
    }

    const run=Math.abs(player.vx)>0?Math.sin(frame*.35)*3:0;
    const jumpOffset=player.grounded?0:-2;

    // Тень
    ctx.fillStyle="#10151c66";
    ctx.beginPath();
    ctx.ellipse(15,y+47,18,5,0,0,Math.PI*2);ctx.fill();

    // Ноги
    ctx.fillStyle="#171d2b";
    ctx.fillRect(4,y+31+run,9,13-run*.3);
    ctx.fillRect(18,y+31-run,9,13+run*.3);

    // Ботинки
    ctx.fillStyle="#0d111a";
    ctx.fillRect(1,y+41+run,13,5);
    ctx.fillRect(17,y+41-run,13,5);

    // Тело
    ctx.fillStyle="#242b3b";
    ctx.fillRect(3,y+15,25,22);

    // Тёмные детали брони
    ctx.fillStyle="#41485b";
    ctx.fillRect(6,y+18,5,12);
    ctx.fillRect(20,y+18,4,10);

    // Руки
    ctx.fillStyle="#202638";
    ctx.fillRect(0,y+18,7,14);
    ctx.fillRect(24,y+18,7,14);

    // Перчатки
    ctx.fillStyle="#bd3545";
    ctx.fillRect(0,y+29,8,5);
    ctx.fillRect(24,y+29,8,5);

    // Голова
    ctx.fillStyle="#1a2030";
    ctx.fillRect(2,y+jumpOffset,27,20);

    // Маска
    ctx.fillStyle="#b83143";
    ctx.fillRect(2,y+11+jumpOffset,27,6);

    // Глаза
    ctx.fillStyle="#f7e9ce";
    ctx.fillRect(17,y+6+jumpOffset,8,3);

    // Повязка на лбу
    ctx.fillStyle="#dc3d4c";
    ctx.fillRect(0,y+2+jumpOffset,29,4);

    // Шарф
    ctx.fillStyle="#e53d4b";
    ctx.beginPath();
    ctx.moveTo(4,y+17);
    ctx.lineTo(-13,y+12+Math.sin(frame*.2)*4);
    ctx.lineTo(-23,y+19+Math.sin(frame*.2)*5);
    ctx.lineTo(-7,y+22);
    ctx.lineTo(4,y+21);
    ctx.closePath();ctx.fill();

    // Пояс
    ctx.fillStyle="#b88b4c";
    ctx.fillRect(3,y+31,25,3);

    // Ножны
    ctx.fillStyle="#131722";
    ctx.fillRect(18,y+29,15,4);

    // Клинок при атаке
    if(attackTime>0){
        ctx.fillStyle="#f1f5f8";
        ctx.beginPath();
        ctx.moveTo(26,y+21);
        ctx.lineTo(57,y+11);
        ctx.lineTo(51,y+23);
        ctx.lineTo(27,y+27);
        ctx.closePath();ctx.fill();

        ctx.strokeStyle="#8eacc7";
        ctx.lineWidth=2;
        ctx.beginPath();
        ctx.moveTo(30,y+23);
        ctx.lineTo(53,y+15);
        ctx.stroke();

        ctx.fillStyle="#c99450";
        ctx.fillRect(25,y+18,5,11);

        // Дуга удара
        ctx.strokeStyle="#fff1b0";
        ctx.lineWidth=3;
        ctx.globalAlpha=.8;
        ctx.beginPath();
        ctx.arc(25,y+23,31,-.9,.6);
        ctx.stroke();
        ctx.globalAlpha=1;
    }

    ctx.restore();
}

// Частицы
function drawParticles(){
    for(const p of particles){
        ctx.globalAlpha=Math.max(0,p.life/p.max);
        ctx.fillStyle=p.color;
        ctx.fillRect(p.x-camera,p.y,p.size,p.size);
    }
    ctx.globalAlpha=1;
}

// Лепестки сакуры
function drawPetals(){
    for(let i=0;i<20;i++){
        const x=(i*67+frame*.45-camera*.12)%(W+30);
        const y=(i*43+frame*(.3+(i%3)*.1))%(H-70);
        ctx.save();
        ctx.translate(x,y);
        ctx.rotate(frame*.025+i);
        ctx.fillStyle=i%2?"#f6b6ce":"#e88fb3";
        ctx.globalAlpha=.8;
        ctx.beginPath();
        ctx.ellipse(0,0,3,6,.4,0,Math.PI*2);
        ctx.fill();
        ctx.restore();
    }
    ctx.globalAlpha=1;
}

function drawHUDCanvas(){
    // Полупрозрачная виньетка
    const grad=ctx.createLinearGradient(0,0,0,100);
    grad.addColorStop(0,"#111724a8");
    grad.addColorStop(1,"#11172400");
    ctx.fillStyle=grad;
    ctx.fillRect(0,0,W,100);

    ctx.fillStyle="#fff0c7";
    ctx.font="bold 15px Arial";
    ctx.fillText("SHINOBI",18,25);

    // Полоса энергии
    ctx.fillStyle="#202c3d";
    ctx.fillRect(18,34,145,9);
    ctx.fillStyle="#58c99a";
    ctx.fillRect(18,34,145*(Math.max(0,player.hp)/3),9);

    ctx.fillStyle="#f7e3ac";
    ctx.font="12px Arial";
    ctx.fillText("ПУТЬ НИНДЗЯ",18,61);
}

// Экран паузы и окончания
function drawOverlay(){
    if(!paused&&state==="playing")return;

    ctx.fillStyle="#080d18b8";
    ctx.fillRect(0,0,W,H);

    ctx.textAlign="center";
    ctx.fillStyle=state==="won"?"#ffdc82":"#fff0d4";
    ctx.font="bold 43px Arial";

    let title=paused?"ПАУЗА":state==="won"?"ПОБЕДА!":"ИГРА ОКОНЧЕНА";
    ctx.fillText(title,W/2,H/2-18);

    ctx.fillStyle="#fff";
    ctx.font="20px Arial";
    ctx.fillText(
        state==="won"?"Сокровище древнего королевства твоё!":
        state==="lost"?"Нажми R, чтобы попробовать снова.":
        "Нажми P или кнопку, чтобы продолжить",
        W/2,H/2+25
    );

    ctx.textAlign="left";
}

function draw(){
    drawBackground();
    drawForest();

    // Фоновые фонари
    drawLantern(100-camera*.5,390);
    drawLantern(600-camera*.5,345);

    drawPlatforms();
    drawCoins();
    drawChest();
    drawEnemies();
    drawPlayer();
    drawParticles();
    drawPetals();
    drawHUDCanvas();
    drawOverlay();
}

function loop(time){
    const dt=lastTime?Math.min(time-lastTime,34):16.67;
    lastTime=time;

    update(dt);
    draw();
    requestAnimationFrame(loop);
}

resetGame();
requestAnimationFrame(loop);
</script>
</body>
</html>
